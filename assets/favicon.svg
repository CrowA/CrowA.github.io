<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- de Sitter Penrose diagram: conformal square, horizon diagonals,
       the observer's static patch shaded in Klein blue -->
  <rect width="64" height="64" rx="12" fill="#0b0b10"/>
  <polygon points="32,32 50,14 50,50" fill="#1512e6" opacity="0.75"/>
  <rect x="14" y="14" width="36" height="36" fill="none" stroke="#8886fc" stroke-width="3" stroke-linejoin="round"/>
  <path d="M14 14 L50 50 M50 14 L14 50" stroke="#e6e5ff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
