    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fffbef" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffbef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain)">
    <rect width="1200" height="1200" fill="url(#g)"/>
    <rect width="1200" height="1200" fill="url(#glow)"/>
    <rect x="0" y="792" width="1200" height="408" fill="#4a3f35" opacity="0.9"/>
  </g>
</svg>
