  <style>
    /* ============ Intro V3: grow-from-centre pile (k95 boot-loader) ============
       Each photo is a layer that grows from the middle outward onto a
       centred 3:4 stack, with a [0]→[100] counter beside the top corner.
       Paced with the site's current beat sheet (long holds on the last
       two), and it exits with the same blue-card window expansion. */
    .introv3 {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #fff;
      display: grid;
      place-content: center;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.9s var(--ease-out), filter 1.1s var(--ease-out);
    }
    .introv3.is-fading {
      opacity: 0;
      filter: blur(28px);
      pointer-events: none;
    }
    .introv3.is-fading.is-patch-expanding {
      filter: none;
    }
    .introv3.is-patch-preview,
    .introv3.is-patch-expanding {
      background: transparent;
      pointer-events: none;
    }
    .introv3__stack {
      position: relative;
      z-index: 2;
      width: min(40vw, 420px);
      aspect-ratio: 3 / 4;
      transform: scale(1);
      transition: transform 2.4s cubic-bezier(0.12, 0.9, 0.22, 1);
      will-change: transform;
    }
    .introv3.is-fading .introv3__stack {
      transform: scale(1.06);
    }
    .introv3.is-patch-preview .introv3__stack {
      filter: blur(8px);
      opacity: 0;
      transition: opacity 0.42s ease, filter 0.42s ease;
    }
    .introv3.is-patch-expanding .introv3__stack {
      filter: blur(8px);
      opacity: 0;
      transition: opacity 0.26s ease, filter 0.32s ease;
    }
    .introv3__layer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      /* Layers grow from the centre and follow the stack's shape, so the
         whole pile widens with the stack on the final frame. */
      width: 0;
      height: 0;
      overflow: hidden;
      /* no border, no blue backing — the photos alone */
      background: transparent;
      border: none;
    }
    .introv3__layer--final {
      background: var(--blue) !important;
      border-color: transparent !important;
    }
    .introv3__layer img {
      position: absolute;
      inset: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      object-fit: cover;
    }
    .introv3__counter {
      position: absolute;
      bottom: 100%;
      left: calc(100% + 12px);
      z-index: 11;
      color: var(--blue);
      font-family: var(--font-display);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
    }
    .introv3__patch {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      z-index: 3;
      background: transparent;
      box-shadow: 0 0 0 200vmax #fff;
      contain: paint;
      opacity: 0;
      pointer-events: none;
      transform: translateZ(0) scale(1);
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .introv3.is-patch-preview .introv3__patch,
    .introv3.is-patch-expanding .introv3__patch {
      opacity: 1;
    }
    @media (max-width: 768px) {
      .introv3__stack {
        width: min(72vw, 320px);
      }
      .introv3__counter {
        font-size: 12px;
        left: calc(100% + 8px);
      }
    }
    .v3-badge {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 400;
      background: var(--blue);
      color: #fff;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: var(--size-micro);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
